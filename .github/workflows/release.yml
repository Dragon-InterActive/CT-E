# Release-Pakete für Linux, Windows und macOS
# Release packages for Linux, Windows and macOS
#
# Auslöser / triggers:
#   - ein Tag `v*` (z. B. `git tag v0.3.0 && git push origin v0.3.0`): baut alle drei
#     Pakete und hängt sie an ein GitHub-Release dieses Tags
#   - von Hand (Actions → Release → Run workflow): baut nur, die Pakete liegen als
#     Artefakte am Lauf (zum Testen)
#
# Windows wird in MSYS2 (UCRT64) gebaut, macOS mit Homebrew; die GTK-Laufzeit
# legen die Skripte aus RUF dazu (tools/bundle-*.sh) – vom selben RUF-Stand, den
# Cargo.lock festhält. Das Linux-Paket braucht GTK 4 (≥ 4.12) und GtkSourceView 5
# vom System.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: GTK 4 und GtkSourceView 5
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgtksourceview-5-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bauen
        run: cargo build --release --locked
      - name: Paket
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          dir=ct-editor-$version-linux-x86_64
          mkdir -p $dir/icons
          cp target/release/ct-editor README.md LICENSE-MIT LICENSE-APACHE $dir/
          cp -r docs $dir/
          cp assets/icons/*.png assets/ct-editor.svg $dir/icons/
          tar czf $dir.tar.gz $dir
          echo "PACKAGE=$dir.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: ${{ env.PACKAGE }}

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - name: RUF-Stand aus Cargo.lock
        id: ruf
        shell: bash
        run: echo "rev=$(grep -m1 -o 'Dragon-InterActive/RUF#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Dragon-InterActive/RUF
          ref: ${{ steps.ruf.outputs.rev }}
          path: ruf
      # Rust mit GNU-Host (passt zu MSYS2; das MSVC-Rust würde für das GNU-Ziel
      # cross-kompilieren, und pkg-config der GTK-Crates verweigert das).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # Rust von rustup (Windows) soll in der MSYS2-Shell sichtbar sein.
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            zip
      - uses: Swatinem/rust-cache@v2
      - name: Bauen
        run: cargo build --release --locked
      - name: Paket mit GTK-Laufzeit
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          dir=ct-editor-$version-windows-x86_64
          ruf/tools/bundle-windows.sh target/release/ct-editor.exe \
              $dir docs LICENSE-MIT LICENSE-APACHE README.md
          zip -qr $dir.zip $dir
          echo "PACKAGE=$dir.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ env.PACKAGE }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: RUF-Stand aus Cargo.lock
        id: ruf
        run: echo "rev=$(grep -m1 -o 'Dragon-InterActive/RUF#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Dragon-InterActive/RUF
          ref: ${{ steps.ruf.outputs.rev }}
          path: ruf
      - name: GTK 4 und Werkzeuge
        run: brew install gtk4 gtksourceview5 adwaita-icon-theme dylibbundler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bauen
        run: cargo build --release --locked
      - name: Paket als .app
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          dir=ct-editor-$version-macos-arm64
          mkdir -p $dir
          ruf/tools/bundle-macos.sh target/release/ct-editor $dir/CT-Editor.app \
              net.dragon-software.ct-editor
          cp -r docs README.md LICENSE-MIT LICENSE-APACHE $dir/
          ditto -c -k --keepParent $dir $dir.zip
          echo "PACKAGE=$dir.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ${{ env.PACKAGE }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: packages/*
          generate_release_notes: true
