# English texts of the CT-Editor.
# New language: copy this file (e.g. fr.toml), translate the values, keep the
# keys unchanged. Keep placeholders in {curly braces}.

[language]
# Name dieser Sprache in ihr selbst (Menü „Sprache“) / name of this language in itself
name = "English"

[app]
save = "Save"
save_tip = "Save Cargo.toml (Ctrl+S)"
reload = "Reload"
reload_tip = "Read Cargo.toml from disk again"
check = "Check with Cargo"
check_tip = "Let “cargo metadata” validate the manifest (F5)"
path = "File: {path}"
path_new = "New file: {path} (not saved yet)"
screenshot_failed = "Could not save screenshot: {path}"

[menu]
file = "File"
open = "Open …"
save = "Save"
save_as = "Save as …"
