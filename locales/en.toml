appearance = "Appearance"
theme_system = "System"
theme_light = "Light"
theme_dark = "Dark"
quit = "Quit"

[tab]
source = "Source"
dependencies = "Dependencies"
package = "Package"
features = "Features"
advanced = "Advanced"

[status]
loaded = "Loaded: {path}"
created = "No Cargo.toml found – a new manifest has been prepared."
saved = "Saved: {path}"
save_failed = "Saving failed: {error}"
parse_error = "Syntax error in line {line}: {message}"
valid = "Syntax OK."
checking = "Cargo is checking the manifest …"
