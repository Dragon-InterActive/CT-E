loading = "Loading details of {name} …"
no_registry_data = "no data from crates.io (path, git or offline dependency)"
version = "Version:"
version_tip = "Version requirement, e.g. 1.0.229, 1.0 or ^0.9 – freely editable"
version_missing = "Please enter a version."
optional = "optional"
optional_tip = "Only active through a feature (optional = true)"
features = "Features:"
features_count = "Features ({count}) – preset are the crate's default features:"
