authors = "Authors, comma-separated"
license = "SPDX license expression, e.g. Apache-2.0 or MIT OR Apache-2.0"
license-file = "Path to a custom license file"
readme = "Path to the README file"
homepage = "Homepage URL"
repository = "Source repository URL"
documentation = "Documentation URL"
keywords = "Up to 5 search keywords for crates.io"
categories = "crates.io categories (slugs)"
build = "Path to the build script (build.rs)"
links = "Name of the native library being linked"
default-run = "Default binary for cargo run"
resolver = "Feature resolver version"
publish = "Publishing to crates.io allowed"
autobins = "Discover binaries automatically"
autoexamples = "Discover examples automatically"
autotests = "Discover tests automatically"
autobenches = "Discover benchmarks automatically"

[features]
list = "Package features:"
name = "Name:"
entries = "Enables:"
entries_placeholder = "e.g. std, dep:serde, serde/derive"
hint = "A feature enables other features or optional dependencies: “std” (own feature), “dep:serde” (optional dependency), “serde/derive” (feature of a dependency). “default” defines what is active when nothing is specified."
new = "New"
apply = "Apply"
remove = "Remove"
name_missing = "Please enter a feature name."
saved = "Feature {name} saved."
removed = "Feature {name} removed."

[advanced]
section = "Section:"
template = "New from template:"
insert = "Insert template"
apply = "Apply"
remove = "Remove section"
applied = "Section [{section}] applied."
removed = "Section [{section}] removed."
template_inserted = "Template for [{section}] inserted – adjust it and click “Apply”."
