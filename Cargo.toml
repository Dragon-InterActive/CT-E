[package]
name = "ct-editor"
description = "CT-Editor – visueller Editor für Cargo.toml-Dateien, Teil des RAD-Tools Freya TDE"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["Dragon Software <info@dragon-software.net>"]
repository = "https://github.com/Dragon-InterActive/CT-E"
keywords = ["cargo", "toml", "editor", "gui", "rad"]
categories = ["development-tools", "gui"]

# Eigenständig: nicht Teil des RUF-Workspaces.
[workspace]

[[bin]]
name = "ct-editor"
path = "src/main.rs"

[lib]
name = "ct_editor"
path = "src/lib.rs"

[dependencies]
# RUF aus seinem Repository, Stand im Cargo.lock; neuer Stand: cargo update -p ruf -p rncl
# RUF from its repository, pinned in Cargo.lock; update: cargo update -p ruf -p rncl
ruf = { git = "https://github.com/Dragon-InterActive/RUF", version = "0.2.0" }
rncl = { git = "https://github.com/Dragon-InterActive/RUF", version = "0.2.0" }
toml_edit = "0.25.17"
ureq = { version = "3.5.0", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }

# Windows: Konsole des Aufrufers nutzen (Release-Builds sind GUI-Programme).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[[test]]
name = "gui"
# Native Toolkits verlangen den Hauptthread – eigenes main().
harness = false
