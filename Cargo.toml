[package]
name = "ct-editor"
description = "CT-Editor – visueller Editor für Cargo.toml-Dateien, Teil des RAD-Tools Freya TD"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["Dragon Software <info@dragon-software.net>"]
repository = "https://github.com/Dragon-InterActive/Freya-TD"
keywords = ["cargo", "toml", "editor", "gui", "rad"]
categories = ["development-tools", "gui"]

# Eigenständig: nicht Teil des RUF-Workspaces.
[workspace]

[[bin]]
name = "ct-editor"
path = "src/main.rs"

[lib]
name = "ct_editor"
path = "src/lib.rs"

[dependencies]
ruf = { path = "../RUF/crates/ruf", version = "0.1.0", features = ["qt6"] }
rncl = { path = "../RUF/crates/rncl", version = "0.1.0" }
toml_edit = "0.25.17"
ureq = { version = "3.5.0", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }

[[test]]
name = "gui"
# Qt verlangt, dass QApplication im Hauptthread lebt – eigenes main().
harness = false
